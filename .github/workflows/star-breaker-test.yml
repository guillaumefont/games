name: Star Breaker headless test

on:
  pull_request:
    paths:
      - "star-breaker/**"
      - ".github/workflows/star-breaker-*.yml"
  push:
    branches: [main]
    paths:
      - "star-breaker/**"
      - ".github/workflows/star-breaker-*.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: star-breaker
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Songs build on the main thread (Android start-up crash)
        run: ./godot --headless --path . --script tests/audio_test.gd
      - name: Crash report, safe graphics, menu device row and screen fill
        run: ./godot --headless --path . --script tests/screen_test.gd
      - name: Self-update (game pack download, checks, APK offer)
        run: ./godot --headless --path . --script tests/update_test.gd
      - name: App icons (project icon, Android launcher layers)
        run: ./godot --headless --path . --script tests/icon_test.gd
      - name: The game (drag, charge beam, pod, ultimates, barriers, rock, bosses)
        run: ./godot --headless --path . --script tests/vertical_test.gd
