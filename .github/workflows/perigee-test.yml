name: Perigee headless test

on:
  pull_request:
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"
  push:
    branches: [main]
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"

jobs:
  # The Godot game: rules, replay and difficulty (sim_test), the scene (game_test), and Voyage sectors (voyage_test).
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: perigee
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/godot"
      - name: Import project
        run: $RUNNER_TEMP/godot --headless --path . --import
      # Each script prints a last line ending in DONE only when every check passed.
      - name: Rules (bot, replay, difficulty ramp past moon 12, momentum, game over)
        run: |
          $RUNNER_TEMP/godot --headless --path . --script tests/sim_test.gd 2>&1 | tee "$RUNNER_TEMP/sim.log"
          grep -q "^SIM TEST DONE" "$RUNNER_TEMP/sim.log"
      - name: Game scene (input, HUD, game over, save file, pause and resume, settings)
        run: |
          $RUNNER_TEMP/godot --headless --path . --script tests/game_test.gd 2>&1 | tee "$RUNNER_TEMP/game.log"
          grep -q "^GAME TEST DONE" "$RUNNER_TEMP/game.log"
      - name: Voyage test
        working-directory: perigee
        run: |
          set -o pipefail
          $RUNNER_TEMP/godot --headless --path . --script tests/voyage_test.gd 2>&1 | tee "$RUNNER_TEMP/voyage.log"
          grep -q "^VOYAGE TEST DONE" "$RUNNER_TEMP/voyage.log"

  # The original web prototype (perigee/web/), kept as the reference until the Godot game
  # feels the same.
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image ships Google Chrome, so Playwright drives it instead of downloading its own
      # Chromium (Playwright's browser installer refuses runner OS versions it doesn't know yet).
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -n "$chrome" ]; then echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"; "$chrome" --version
          else "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium; fi
      - name: Prototype play test
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SHOT: ${{ runner.temp }}/perigee.png
        run: |
          node perigee/tests/prototype_play_test.cjs 2>&1 | tee "$RUNNER_TEMP/play.log"
          grep -q "^PLAY TEST DONE" "$RUNNER_TEMP/play.log" || { echo "::error::The play test did not reach its end"; exit 1; }
