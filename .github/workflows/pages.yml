name: Deploy Pages

# Deploys the whole gh-pages branch (every game's main build + its pr/N previews) to GitHub
# Pages, plus the site's root pages from .github/pages/ (the games list and the 404 page).
# Each game's Builds workflow only pushes to gh-pages and then starts this workflow, so all
# deployments go through this one queue instead of racing each other.
# Needs Settings > Pages > Source = "GitHub Actions", and the github-pages environment
# (Settings > Environments) must allow deployments from main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, never cancelled half-way. While one deploys, only the newest
# request waits (GitHub drops older pending runs). That loses nothing: every run deploys
# gh-pages as it is when it starts, so the waiting run includes all the earlier pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # While Pages still deploys from the gh-pages branch, GitHub's own run publishes it and
  # this workflow has nothing to do (and isn't allowed to), so it skips instead of failing.
  source:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || echo unknown)
          echo "Pages source: $t"
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" != workflow ]; then
            echo "::notice::Pages deploys from a branch; skipping. Switch Settings > Pages > Source to GitHub Actions to use this workflow."
          fi

  deploy:
    needs: source
    if: needs.source.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: .github/pages
      - name: Add the root pages
        run: cp src/.github/pages/index.html src/.github/pages/404.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub's Pages API sometimes fails to find the artifact just uploaded ("Fetching artifact
      # metadata failed"). Nothing deploys again until the next push, so the site stays on an old
      # build (Star Breaker sat on b1112 while main was b1115, 2026-11-20): try once more.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
