name: Perigee builds

# Exports the Godot game (perigee/) for Web and Android and publishes it on GitHub Pages
# (gh-pages branch), next to the original web prototype (perigee/web/, kept as the reference
# for how the hop should feel):
#   main           -> https://<owner>.github.io/<repo>/perigee/ + perigee.apk + prototype/
#   pull request N -> https://<owner>.github.io/<repo>/perigee/pr/N/ + perigee.apk + prototype/
# Each open PR keeps its own preview, linked in a comment on the PR; it is removed when the PR
# is closed. The APK is also attached to each run as an artifact.
# Builds only push to the gh-pages branch; the site itself is deployed by pages.yml.
on:
  push:
    branches: [main]
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"
      - ".github/publish-pages.sh"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"
      - ".github/publish-pages.sh"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # start the Deploy Pages workflow

# one build per branch/PR at a time (a newer push cancels the older build)
concurrency:
  group: builds-perigee-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  APK_NAME: perigee.apk

jobs:
  export:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: perigee
    steps:
      - uses: actions/checkout@v4

      - name: Cache export templates
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-web-android

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip

      - name: Download export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz 'templates/web_nothreads_*' 'templates/android_*' 'templates/version.txt'
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/" && rm -rf tpl.tpz templates

      # Same scheme as the other games: build number = 1000 + run number of this workflow. It is
      # the APK's versionCode, which only grows, so every build (including the Godot ones after
      # the old WebView ones) installs over the previous one.
      - name: Build number
        run: echo "BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Every test APK must be signed with the SAME key, or Android refuses to install it over
      # the previous one. So the test keystore is fixed: perigee/.github/android/debug.keystore
      # (the key the WebView builds used), unless an ANDROID_DEBUG_KEYSTORE_BASE64 secret
      # provides another one. Never used for a store release.
      - name: Android signing (debug keystore) and editor settings
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else cp .github/android/debug.keystore "$ks"; fi
          keytool -list -keystore "$ks" -storepass android -alias androiddebugkey | tail -1
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        run: $RUNNER_TEMP/godot --headless --path . --import

      # Build id (run number, PR, commit), kept in the project settings for crash reports.
      - name: Stamp build id
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          id="b$BUILD${PR:+ pr$PR} ${SHA::7}"
          sed -i "/^config\/name=/a config/version=\"$id\"" project.godot
          grep -m1 '^config/version' project.godot

      # outputs go outside the project folder, so Godot never imports them as assets
      - name: Export Web
        run: |
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/web"
          $RUNNER_TEMP/godot --headless --path . --export-release Web "$OUT/web/index.html"
          test -s "$OUT/web/index.wasm"

      # Release template (about half the size of the debug one), signed with the test keystore.
      - name: Export Android (release APK)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          name="2.0.0-${PR:+pr$PR.}b$BUILD"
          sed -i "0,/^version\/code=.*/s//version\/code=$BUILD/; 0,/^version\/name=.*/s//version\/name=\"$name\"/" export_presets.cfg
          grep -m2 '^version/' export_presets.cfg
          mkdir -p "$OUT/android"
          $RUNNER_TEMP/godot --headless --path . --export-release Android "$OUT/android/$APK_NAME"
          test -s "$OUT/android/$APK_NAME"
          printf '{"build": %d, "name": "%s", "apk": "%s", "commit": "%s"}\n' \
            "$BUILD" "$name" "$APK_NAME" "${GITHUB_SHA::7}" > "$OUT/android/version.json"
          cat "$OUT/android/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: perigee-apk
          path: ${{ runner.temp }}/out/android/${{ env.APK_NAME }}

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST: ${{ github.event.pull_request.number && format('perigee/pr/{0}', github.event.pull_request.number) || 'perigee' }}
        run: |
          mkdir -p "$OUT/stage/prototype"
          cp -r "$OUT/web/." "$OUT/stage/"
          cp "$OUT/android/$APK_NAME" "$OUT/android/version.json" "$OUT/stage/"
          cp -r web/. "$OUT/stage/prototype/"
          rm -f "$OUT/stage/prototype/.gdignore"
          bash "$GITHUB_WORKSPACE/.github/publish-pages.sh" "$OUT/stage" "$DEST" "Build of ${GITHUB_SHA::7} for $DEST"

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" || echo "::warning::Could not start Deploy Pages"

      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            const base = `https://${context.repo.owner}.github.io/${context.repo.repo}/perigee/pr/${n}/`;
            const body = `<!-- preview:perigee -->\n**Perigee preview of this PR** (build ${process.env.BUILD}, updated on every push, sha ${context.sha.slice(0, 7)})\n\n- Play in the browser: ${base}\n- Android APK: ${base}${process.env.APK_NAME}\n- Web prototype (the reference feel): ${base}prototype/\n\nIt may take a minute after the build for GitHub Pages to refresh. The APK is also attached to the workflow run as an artifact.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: n });
            const old = comments.find(c => c.body.startsWith('<!-- preview:perigee -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });

  # a closed PR's preview is deleted
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove the PR preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-pages.sh "" "perigee/pr/${{ github.event.pull_request.number }}" "Remove perigee preview of PR ${{ github.event.pull_request.number }}"

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" || echo "::warning::Could not start Deploy Pages"
