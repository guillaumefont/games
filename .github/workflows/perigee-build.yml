name: Perigee builds

# Builds both versions of Perigee while the Godot port (perigee/, a Godot 4.7 project) is checked
# against the original web game (perigee/web/, wrapped as a WebView app in perigee/android/):
#   - the Godot game for Web and Android: the site's main page and perigee.apk
#   - the web prototype: prototype/ and perigee-webview.apk; the Google Play bundle is still this one
# Published layout (main at /perigee/, pull request N at /perigee/pr/N/):
#   index.html (Godot web) · perigee.apk (Godot) · privacy.html · prototype/ (web game) · perigee-webview.apk
#
# Packages the web game (perigee/web/, one HTML file plus fonts) as an Android APK, a full-screen
# WebView that plays offline (perigee/android/, a Gradle project), and publishes both on
# GitHub Pages (gh-pages branch):
#   main           -> https://<owner>.github.io/<repo>/perigee/ (play in the browser) + perigee.apk
#   pull request N -> https://<owner>.github.io/<repo>/perigee/pr/N/ + perigee.apk
# Each open PR keeps its own preview, linked in a comment on the PR; it is removed when the PR
# is closed. The APK is also attached to each run as an artifact. On main (and manual runs), it also
# builds the Google Play app bundle with the upload key and sends it to the internal testing track.
# Builds only push to the gh-pages branch; the site itself is deployed by pages.yml.
on:
  push:
    branches: [main]
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"
      - ".github/publish-pages.sh"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "perigee/**"
      - ".github/workflows/perigee-*.yml"
      - ".github/publish-pages.sh"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # start the Deploy Pages workflow

# one build per branch/PR at a time (a newer push cancels the older build)
concurrency:
  group: builds-perigee-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: perigee.apk
  GODOT_VERSION: 4.7.2

jobs:
  export:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same scheme as the other games: build number = 1000 + run number. It is the APK's
      # versionCode, which only grows, so every build installs over the previous one.
      - name: Build number
        run: echo "BUILD=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4

      # Every preview APK must be signed with the SAME key, or Android refuses to install it over the
      # previous one. So the test keystore is fixed: perigee/android/debug.keystore, unless an
      # ANDROID_DEBUG_KEYSTORE_BASE64 secret provides another one.
      - name: Build the APK (test-signed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > perigee/android/debug.keystore; fi
          name="1.0-${PR:+pr$PR.}b$BUILD"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          (cd perigee/android && VERSION_NAME="$name" ./gradlew --no-daemon assembleRelease bundleRelease) # the test-signed bundle only checks that it builds
          cp perigee/android/build/outputs/apk/release/perigee-release.apk "$OUT/$APK_NAME"
          printf '{"build": %d, "name": "%s", "apk": "%s", "commit": "%s"}\n' \
            "$BUILD" "$name" "$APK_NAME" "${GITHUB_SHA::7}" > "$OUT/version.json"
          cat "$OUT/version.json"

      # Google Play build: an app bundle signed with the upload key (secrets PERIGEE_UPLOAD_KEYSTORE_BASE64,
      # PERIGEE_UPLOAD_STORE_PASSWORD, PERIGEE_UPLOAD_KEY_ALIAS, PERIGEE_UPLOAD_KEY_PASSWORD; see perigee/README.md).
      # Built on main and on manual runs only, and skipped until the key is set up.
      - name: Build the Play bundle (upload-signed)
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_B64: ${{ secrets.PERIGEE_UPLOAD_KEYSTORE_BASE64 }}
          PERIGEE_UPLOAD_STORE_PASSWORD: ${{ secrets.PERIGEE_UPLOAD_STORE_PASSWORD }}
          PERIGEE_UPLOAD_KEY_ALIAS: ${{ secrets.PERIGEE_UPLOAD_KEY_ALIAS }}
          PERIGEE_UPLOAD_KEY_PASSWORD: ${{ secrets.PERIGEE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_B64" ]; then
            echo "::warning::No PERIGEE_UPLOAD_KEYSTORE_BASE64 secret yet, so no Play bundle was built (see perigee/README.md)."
            exit 0
          fi
          export PERIGEE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_B64" | base64 -d > "$PERIGEE_UPLOAD_KEYSTORE"
          name="1.0.$BUILD"
          (cd perigee/android && VERSION_NAME="$name" ./gradlew --no-daemon bundleRelease)
          rm -f "$PERIGEE_UPLOAD_KEYSTORE"
          cp perigee/android/build/outputs/bundle/release/perigee-release.aab "$OUT/perigee.aab"
          echo "AAB=$OUT/perigee.aab" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: env.AAB != ''
        with:
          name: perigee-aab
          path: ${{ env.AAB }}

      # Sends each main build to the internal testing track as a draft (roll it out from Play Console).
      # Needs a PLAY_SERVICE_ACCOUNT_JSON secret; skipped without it. The very first bundle must be
      # uploaded by hand in Play Console, which this step can't do for an app that has no release yet.
      - name: Send to Google Play (internal testing, draft)
        if: env.AAB != '' && github.event_name == 'push'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so the bundle was not sent to Google Play."; exit 0; fi
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"
      - uses: r0adkll/upload-google-play@v1.1.3
        if: env.PLAY_UPLOAD == '1'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.guillaumefont.perigee
          releaseFiles: ${{ env.AAB }}
          track: internal
          status: draft

      # ---------- the Godot game ----------
      - name: Cache Godot export templates
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-web-android

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip

      - name: Download Godot export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz 'templates/web_nothreads_*' 'templates/android_*' 'templates/version.txt'
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/" && rm -rf tpl.tpz templates

      # Signed with the same test key as the WebView APK above (android/debug.keystore, or the
      # ANDROID_DEBUG_KEYSTORE_BASE64 secret written over it), so either installs over the other.
      - name: Godot Android signing and editor settings
        run: |
          ks="$GITHUB_WORKSPACE/perigee/android/debug.keystore"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres
          for k in DEBUG RELEASE; do
            echo "GODOT_ANDROID_KEYSTORE_${k}_PATH=$ks" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_${k}_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_${k}_PASSWORD=android" >> "$GITHUB_ENV"
          done

      - name: Godot import and build id
        working-directory: perigee
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $RUNNER_TEMP/godot --headless --path . --import
          id="b$BUILD${PR:+ pr$PR} ${SHA::7}"
          sed -i "/^config\/name=/a config/version=\"$id\"" project.godot
          grep -m1 '^config/version' project.godot

      # outputs go outside the project folder, so Godot never imports them as assets
      - name: Godot export (Web, and Android release APK)
        working-directory: perigee
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$OUT/godot-web" "$OUT/godot-android"
          $RUNNER_TEMP/godot --headless --path . --export-release Web "$OUT/godot-web/index.html"
          test -s "$OUT/godot-web/index.wasm"
          name="2.0.0-${PR:+pr$PR.}b$BUILD"
          sed -i "0,/^version\/code=.*/s//version\/code=$BUILD/; 0,/^version\/name=.*/s//version\/name=\"$name\"/" export_presets.cfg
          grep -m2 '^version/' export_presets.cfg
          $RUNNER_TEMP/godot --headless --path . --export-release Android "$OUT/godot-android/$APK_NAME"
          test -s "$OUT/godot-android/$APK_NAME"
          git checkout -- export_presets.cfg project.godot

      - uses: actions/upload-artifact@v4
        with:
          name: perigee-apk
          path: ${{ runner.temp }}/out/godot-android/${{ env.APK_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: perigee-webview-apk
          path: ${{ runner.temp }}/out/${{ env.APK_NAME }}

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST: ${{ github.event.pull_request.number && format('perigee/pr/{0}', github.event.pull_request.number) || 'perigee' }}
        run: |
          mkdir -p "$OUT/stage/prototype"
          cp -r "$OUT/godot-web/." "$OUT/stage/"
          cp "$OUT/godot-android/$APK_NAME" "$OUT/version.json" perigee/web/privacy.html "$OUT/stage/"
          cp "$OUT/$APK_NAME" "$OUT/stage/perigee-webview.apk"
          cp -r perigee/web/. "$OUT/stage/prototype/"
          rm -f "$OUT/stage/prototype/.gdignore"
          bash .github/publish-pages.sh "$OUT/stage" "$DEST" "Build of ${GITHUB_SHA::7} for $DEST"

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" || echo "::warning::Could not start Deploy Pages"

      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            const base = `https://${context.repo.owner}.github.io/${context.repo.repo}/perigee/pr/${n}/`;
            const body = `<!-- preview:perigee -->\n**Perigee preview of this PR** (build ${process.env.BUILD}, updated on every push, sha ${context.sha.slice(0, 7)})\n\n- Play in the browser: ${base}\n- Android APK: ${base}${process.env.APK_NAME}\n- Web prototype (the reference feel): ${base}prototype/ (its WebView APK: ${base}perigee-webview.apk)\n\nIt may take a minute after the build for GitHub Pages to refresh. The APK is also attached to the workflow run as an artifact.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: n });
            const old = comments.find(c => c.body.startsWith('<!-- preview:perigee -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });

  # a closed PR's preview is deleted
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove the PR preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-pages.sh "" "perigee/pr/${{ github.event.pull_request.number }}" "Remove perigee preview of PR ${{ github.event.pull_request.number }}"

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" || echo "::warning::Could not start Deploy Pages"
